    database: demo_db
    schema: dbt_keerthana04110510
    tables:
      - name: ecomm_customers
        columns:
          - name: customer_id
            description: It contains the unique id or the business id of the customer table
            tests:
              - unique
              - not_null
                  
      - name: ecomm_products
        columns:
          - name: product_id
