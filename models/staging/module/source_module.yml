version: 2

sources:
  - name: insurance_raw
    database: demo_db
    schema: dbt_keerthana04110510
    tables:
      - name: raw_policies
        description: "describes the policies "
        config: 
          loaded_at_field: updated_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour

        columns:
          - name: policy_id
            tests:
              - not_null
              - unique
          - name: status
            tests:
              - accepted_values:
                  arguments: 
                     values: ['Active','lapsed','cancelled']
              
      - name: raw_claims
        description: " describe claims"
        config: 
          loaded_at_field: updated_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour

      - name: raw_agent
        description: " describe agent"
        columns:
          - name: policy_id
            tests:
              - not_null
        config: 
          loaded_at_field: updated_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
      - name: raw_customers
        description: " describe customer"
        columns:
          - name: policy_id
            tests:
              - not_null
        config: 
          loaded_at_field: updated_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour

